# ============================================================
# RailGuard AI - Spring Boot Application Configuration
# ============================================================

spring.application.name=railguard

# ============================================================
# MySQL DataSource Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/railguard_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# HikariCP Connection Pool
# ============================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=RailGuardHikariPool

# ============================================================
# Spring Data JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Server Configuration
# ============================================================
server.port=8080

# ============================================================
# JWT & OAuth Security Configuration
# ============================================================
app.jwt.secret=${JWT_SECRET:}
app.google.client-id=${GOOGLE_CLIENT_ID:}


# ============================================================
# Actuator Configuration
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.app.name=RailGuard AI
management.info.app.description=AI-Powered Railway Track Defect Detection System
management.info.app.version=1.0.0-PHASE1

# ============================================================
# Logging
# ============================================================
logging.level.com.railguard=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
