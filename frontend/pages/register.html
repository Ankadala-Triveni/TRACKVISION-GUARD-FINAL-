<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TRACKVISION GUARD – Railway Track Defect Detection and Safety Monitoring System">
    <title>Register – TRACKVISION GUARD</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Dedicated Sky Blue + Slate Blue Stylesheet -->
    <link href="../css/login.css" rel="stylesheet">
    <!-- Google Identity Services (GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .register-card {
            max-width: 500px;
        }
        .captcha-box {
            background: #f0f7fd;
            border: 1px solid var(--login-border);
            border-radius: 8px;
            padding: 0.75rem;
        }
        .captcha-img-wrap {
            background: #ffffff;
            border: 1px solid var(--login-border);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 150px;
            overflow: hidden;
        }
        .captcha-img-wrap img {
            height: 42px;
            display: block;
        }
    </style>
</head>
<body class="login-page-body">

    <div class="login-card register-card">
        <!-- Brand Header (Centered Train Logo & Title) -->
        <div class="login-brand-header">
            <div class="login-brand-icon">
                <i class="bi bi-train-front"></i>
            </div>
            <h1 class="login-brand-title">TRACKVISION GUARD</h1>
            <p class="login-brand-subtitle">Railway Track Defect Detection and Safety Monitoring System</p>
        </div>

        <div class="mb-3 text-center">
            <h2 class="h5 fw-bold text-dark font-outfit mb-1">Create Account</h2>
            <p class="text-muted small mb-0">Register your credentials to access the track safety monitoring platform</p>
        </div>

        <!-- Alert Notification Box -->
        <div class="login-alert login-alert-danger" id="alert-error" role="alert"></div>
        <div class="login-alert login-alert-success" id="alert-success" role="alert"></div>

            <!-- Registration Form -->
            <form id="register-form" novalidate>
                <!-- Full Name & Username in 2 Columns -->
                <div class="row g-2 mb-2">
                    <div class="col-sm-6">
                        <label for="fullName" class="login-form-label">Full Name</label>
                        <input 
                            type="text" 
                            class="login-input" 
                            id="fullName" 
                            placeholder="e.g. Inspector Ramesh" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                    <div class="col-sm-6">
                        <label for="username" class="login-form-label">Username</label>
                        <input 
                            type="text" 
                            class="login-input" 
                            id="username" 
                            placeholder="e.g. ramesh_ir" 
                            required 
                            autocomplete="username"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <!-- Email Address -->
                <div class="mb-2">
                    <label for="email" class="login-form-label">Email Address</label>
                    <input 
                        type="email" 
                        class="login-input" 
                        id="email" 
                        placeholder="e.g. ramesh@railways.gov.in" 
                        required 
                        autocomplete="email"
                        spellcheck="false"
                    >
                </div>

                <!-- Password & Confirm Password in 2 Columns -->
                <div class="row g-2 mb-2">
                    <div class="col-sm-6">
                        <label for="password" class="login-form-label">Password</label>
                        <div class="login-input-group">
                            <input 
                                type="password" 
                                class="login-input" 
                                id="password" 
                                placeholder="Min 8 characters" 
                                required 
                                autocomplete="new-password"
                            >
                            <button type="button" class="login-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye" id="toggle-password-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label for="confirmPassword" class="login-form-label">Confirm Password</label>
                        <div class="login-input-group">
                            <input 
                                type="password" 
                                class="login-input" 
                                id="confirmPassword" 
                                placeholder="Re-enter password" 
                                required 
                                autocomplete="new-password"
                            >
                            <button type="button" class="login-toggle-btn" id="toggle-confirm-password" aria-label="Toggle confirm password visibility">
                                <i class="bi bi-eye" id="toggle-confirm-icon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Security CAPTCHA Challenge -->
                <div class="mb-3 captcha-box">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-semibold text-dark">
                            <i class="bi bi-shield-check text-primary me-1"></i> Security Verification
                        </span>
                        <span class="text-muted" style="font-size: 0.75rem;">Anti-Bot Check</span>
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div class="captcha-img-wrap" id="captcha-wrap" style="background: #e0f2fe; border: 1.5px solid #94a3b8; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; min-width: 160px; overflow: hidden;">
                            <canvas id="register-captcha-canvas" width="160" height="46" style="display: block; border-radius: 4px; cursor: pointer; background: #e0f2fe;" title="Click to refresh CAPTCHA"></canvas>
                        </div>
                        <button type="button" class="btn btn-outline-secondary btn-sm p-2" id="btn-refresh-captcha" title="Get new CAPTCHA code">
                            <i class="bi bi-arrow-repeat fs-6"></i>
                        </button>
                    </div>
                    <script>
                        (function() {
                            function drawQuick() {
                                var cv = document.getElementById('register-captcha-canvas');
                                if (!cv) return;
                                var chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
                                var code = '';
                                for (var i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
                                window.__RG_REG_CAPTCHA = code;
                                var ctx = cv.getContext('2d');
                                var w = 160, h = 46;
                                var grad = ctx.createLinearGradient(0, 0, w, h);
                                grad.addColorStop(0, '#e0f2fe');
                                grad.addColorStop(1, '#dbeafe');
                                ctx.fillStyle = grad;
                                ctx.fillRect(0, 0, w, h);
                                ctx.strokeStyle = '#93c5fd';
                                ctx.lineWidth = 1.5;
                                for (var l = 0; l < 4; l++) {
                                    ctx.beginPath();
                                    ctx.moveTo(Math.random()*w, Math.random()*h);
                                    ctx.bezierCurveTo(Math.random()*w, Math.random()*h, Math.random()*w, Math.random()*h, Math.random()*w, Math.random()*h);
                                    ctx.stroke();
                                }
                                var colors = ['#1e40af', '#0369a1', '#1d4ed8', '#1e3a8a', '#2563eb'];
                                var step = (w - 24) / code.length;
                                for (var c = 0; c < code.length; c++) {
                                    ctx.save();
                                    var x = 14 + c * step;
                                    var y = 32 + (Math.random() * 4 - 2);
                                    ctx.translate(x, y);
                                    ctx.rotate((Math.random() * 0.28) - 0.14);
                                    ctx.font = 'bold 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
                                    ctx.fillStyle = colors[c % colors.length];
                                    ctx.fillText(code[c], 0, 0);
                                    ctx.restore();
                                }
                            }
                            if (document.readyState === 'loading') {
                                document.addEventListener('DOMContentLoaded', drawQuick);
                            } else {
                                drawQuick();
                            }
                            setTimeout(drawQuick, 50);
                        })();
                    </script>
                    <input 
                        type="text" 
                        class="login-input" 
                        id="captcha-answer" 
                        placeholder="Enter characters shown above" 
                        maxlength="6" 
                        autocomplete="off" 
                        required 
                        style="letter-spacing: 2px; font-weight: 700; text-transform: uppercase;"
                    >
                    <input type="hidden" id="captcha-id">
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn-login-slate" id="btn-submit">
                    <span class="spinner-border spinner-border-sm d-none" id="btn-spinner" role="status" aria-hidden="true"></span>
                    <span id="btn-text">Register Account</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="login-divider">
                <span>OR</span>
            </div>

            <!-- Google Sign-In Button -->
            <button type="button" class="btn-login-google" id="btn-google-login">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Login Link -->
            <div class="login-footer">
                Already have an account? <a href="login.html" class="login-link fw-semibold">Sign In here</a>
            </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/register.js?v=3.0"></script>
</body>
</html>
